<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little World of Us ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #674c53;
  background: linear-gradient(135deg, #fff7f8, #fce8ed, #fff3f5);
  text-align: center;
  overflow-x: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* WELCOME SCREEN */

.cover {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.cover-card {
  width: 100%;
  max-width: 430px;
  padding: 36px 22px;
  background: rgba(255,255,255,0.78);
  border: 1px solid #f3d4dd;
  border-radius: 28px;
  box-shadow: 0 12px 35px rgba(160,105,125,0.13);
  position: relative;
}

.cover-heart {
  font-size: 38px;
  color: #d58b9f;
  margin-bottom: 12px;
  animation: heartbeat 2s infinite;
}

h1 {
  font-weight: normal;
  font-size: clamp(28px, 7vw, 38px);
  line-height: 1.3;
  margin: 8px 0 20px;
}

.intro {
  font-size: 17px;
  line-height: 1.9;
  color: #846b72;
  margin-bottom: 28px;
}

.main-button {
  padding: 13px 21px;
  border: 1px solid #e9bac9;
  border-radius: 30px;
  background: #f9e1e8;
  color: #76515d;
  font-size: 15px;
}

.main-button:active {
  transform: scale(0.96);
}

.small-note {
  margin-top: 22px;
  color: #a4878f;
  font-size: 13px;
}

/* SCRAPBOOK */

.scrapbook {
  display: none;
  min-height: 100vh;
  padding: 24px 14px 35px;
  position: relative;
}

.heading {
  font-size: 29px;
  margin: 8px 0;
}

.subtitle {
  font-size: 14px;
  color: #a1818b;
  margin: 0 0 22px;
}

.page-frame {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 9px;
  background: rgba(255,255,255,0.85);
  border: 1px solid #f0d1da;
  border-radius: 17px;
  box-shadow: 0 10px 28px rgba(160,105,125,0.13);
  position: relative;
  z-index: 1;
}

.scrapbook-image {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 10px;
}

.page-counter {
  margin: 20px 0 12px;
  color: #98747f;
  font-size: 15px;
  letter-spacing: 1px;
}

/* CUTE STICKER NAVIGATION */

.navigation {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 42px;
  margin: 15px auto 22px;
}

.sticker-button {
  width: 76px;
  height: 76px;
  border: 2px solid rgba(233,186,201,0.75);
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  box-shadow: 0 5px 13px rgba(160,105,125,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  animation: float 2.7s ease-in-out infinite;
  transition: transform 0.2s, background 0.2s;
}

.sticker-button .emoji {
  font-size: 31px;
  line-height: 1.1;
}

.sticker-button .label {
  font-family: Arial, sans-serif;
  font-size: 10px;
  color: #a07885;
}

.sticker-button:nth-child(2) {
  animation-delay: 0.5s;
}

.sticker-button:active {
  transform: scale(0.88);
  background: #fce3eb;
}

.sticker-button:disabled {
  opacity: 0.35;
  animation: none;
  cursor: default;
}

.music-button {
  padding: 11px 19px;
  border: 1px solid #e9bac9;
  border-radius: 30px;
  background: rgba(255,255,255,0.75);
  color: #76515d;
  font-size: 14px;
  margin: 4px;
}

.back-button {
  display: block;
  margin: 14px auto 0;
  padding: 10px;
  border: none;
  background: transparent;
  color: #9c7c85;
  font-size: 14px;
}

.bottom-heart {
  color: #d59aaa;
  font-size: 20px;
  margin-top: 20px;
}

/* DECORATIVE FLOWERS */

.decoration {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  opacity: 0.72;
  animation: float 4s ease-in-out infinite;
}

.flower-one {
  top: 15%;
  left: 5%;
  font-size: 25px;
}

.flower-two {
  top: 33%;
  right: 4%;
  font-size: 22px;
  animation-delay: 1s;
}

.flower-three {
  bottom: 12%;
  left: 7%;
  font-size: 21px;
  animation-delay: 1.5s;
}

.sparkle-one {
  top: 12%;
  right: 12%;
  font-size: 19px;
  animation-delay: 0.8s;
}

.sparkle-two {
  bottom: 20%;
  right: 8%;
  font-size: 22px;
  animation-delay: 1.2s;
}

/* ANIMATIONS */

@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-7px) rotate(3deg);
  }
}

@keyframes heartbeat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
}

@media (max-width: 400px) {
  .cover-card {
    padding: 30px 18px;
  }

  .intro {
    font-size: 16px;
  }

  .navigation {
    gap: 35px;
  }

  .sticker-button {
    width: 70px;
    height: 70px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- EXISTING PIANO MUSIC -->
<audio id="backgroundMusic" loop preload="auto">
  <source src="our_little_melody_soft.wav" type="audio/wav">
</audio>

<!-- WELCOME SCREEN -->
<section class="cover" id="cover">
  <div class="cover-card">

    <div class="cover-heart">♡</div>

    <h1>A Little World of Us</h1>

    <div class="intro">
      For the little moments,<br>
      the silly memories,<br>
      and all the little things<br>
      that make our world special.<br><br>
      Some memories deserve<br>
      a place of their own. 🌸
    </div>

    <button class="main-button" id="startButton">
      ♫ Play the melody ♫
    </button>

    <div class="small-note">
      A little scrapbook of memories ♡
    </div>

  </div>
</section>

<!-- SCRAPBOOK PAGES -->
<main class="scrapbook" id="scrapbook">

  <!-- DECORATIVE DOODLES -->
  <div class="decoration flower-one">🌸</div>
  <div class="decoration flower-two">🌷</div>
  <div class="decoration flower-three">✿</div>
  <div class="decoration sparkle-one">✧</div>
  <div class="decoration sparkle-two">✨</div>

  <h1 class="heading">Our Little Memories ♡</h1>

  <p class="subtitle">
    Little moments, kept somewhere special.
  </p>

  <div class="page-frame">
    <img
      id="scrapbookImage"
      class="scrapbook-image"
      src="scrapbook1.png"
      alt="Our scrapbook memories"
    >
  </div>

  <div class="page-counter" id="pageCounter">
    ♡ 1 of 3 ♡
  </div>

  <!-- HEART GOES BACK; TEDDY GOES FORWARD -->
  <div class="navigation">

    <button
      class="sticker-button"
      id="previousButton"
      aria-label="Previous page"
      disabled
    >
      <span class="emoji">💗</span>
      <span class="label">back</span>
    </button>

    <button
      class="sticker-button"
      id="nextButton"
      aria-label="Next page"
    >
      <span class="emoji">🧸</span>
      <span class="label">next</span>
    </button>

  </div>

  <button class="music-button" id="musicButton">
    ♫ Pause music
  </button>

  <button class="back-button" id="backButton">
    ↶ Back to the beginning
  </button>

  <div class="bottom-heart">♡ 🌷 ♡</div>

</main>

<script>
const cover = document.getElementById("cover");
const scrapbook = document.getElementById("scrapbook");

const music = document.getElementById("backgroundMusic");
music.volume = 0.15;

const startButton = document.getElementById("startButton");
const musicButton = document.getElementById("musicButton");
const backButton = document.getElementById("backButton");

const image = document.getElementById("scrapbookImage");
const pageCounter = document.getElementById("pageCounter");

const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

/* Exact filenames in your GitHub repository */
const pages = [
  "scrapbook1.png",
  "scrapbook2.png",
  "scrapbook3.png"
];

let currentPage = 0;

/* Update the image and navigation state */
function showPage() {
  image.src = pages[currentPage];

  pageCounter.textContent =
    "♡ " + (currentPage + 1) + " of " + pages.length + " ♡";

  previousButton.disabled = currentPage === 0;
  nextButton.disabled = currentPage === pages.length - 1;

  /* Cute final-page flower instead of the teddy */
  if (currentPage === pages.length - 1) {
    nextButton.querySelector(".emoji").textContent = "🌸";
    nextButton.querySelector(".label").textContent = "the end";
  } else {
    nextButton.querySelector(".emoji").textContent = "🧸";
    nextButton.querySelector(".label").textContent = "next";
  }

  if (currentPage === 0) {
    previousButton.querySelector(".emoji").textContent = "💗";
    previousButton.querySelector(".label").textContent = "back";
  }
}

/* Open scrapbook and start piano after the tap */
startButton.addEventListener("click", async function() {
  cover.style.display = "none";
  scrapbook.style.display = "block";

  currentPage = 0;
  showPage();

  try {
    await music.play();
  } catch (error) {
    console.log("Tap the music button to start playback.");
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Previous page */
previousButton.addEventListener("click", function() {
  if (currentPage > 0) {
    currentPage--;
    showPage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* Next page */
nextButton.addEventListener("click", function() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    showPage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* Play and pause music */
musicButton.addEventListener("click", async function() {
  if (music.paused) {
    try {
      await music.play();
    } catch (error) {
      console.log("Music could not start:", error);
    }
  } else {
    music.pause();
  }
});

/* Keep music button text synchronized */
music.addEventListener("play", function() {
  musicButton.textContent = "♫ Pause music";
});

music.addEventListener("pause", function() {
  musicButton.textContent = "♫ Play music";
});

/* Return to welcome screen */
backButton.addEventListener("click", function() {
  scrapbook.style.display = "none";
  cover.style.display = "flex";

  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Start with the correct first-page state */
showPage();
</script>

</body>
</html>
