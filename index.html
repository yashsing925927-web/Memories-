<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little World of Us ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #674c53;
      background: linear-gradient(
        135deg,
        #fff7f8,
        #fce8ed,
        #fff3f5
      );
      text-align: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .cover {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .cover-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 24px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #f3d4dd;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(160, 105, 125, 0.12);
    }

    .little-heart {
      font-size: 35px;
      margin-bottom: 12px;
      color: #d58b9f;
    }

    h1 {
      font-size: clamp(29px, 7vw, 39px);
      line-height: 1.25;
      font-weight: normal;
      margin: 8px 0 22px;
    }

    .intro-text {
      font-size: 17px;
      line-height: 1.9;
      color: #846b72;
      margin-bottom: 28px;
    }

    .main-button,
    .nav-button,
    .music-button {
      border: 1px solid #e9bac9;
      border-radius: 30px;
      background: #f9e1e8;
      color: #76515d;
      padding: 12px 20px;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .main-button:hover,
    .nav-button:hover,
    .music-button:hover {
      background: #f4d1dc;
      transform: translateY(-2px);
    }

    .small-note {
      margin-top: 22px;
      font-size: 13px;
      color: #a4878f;
    }

    .scrapbook {
      min-height: 100vh;
      padding: 24px 14px 35px;
      display: none;
    }

    .top-heading {
      font-size: 29px;
      font-weight: normal;
      margin: 8px 0 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #a1818b;
      margin: 0 0 22px;
    }

    .page-frame {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 10px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid #f0d1da;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(160, 105, 125, 0.12);
    }

    .scrapbook-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      object-fit: contain;
    }

    .page-counter {
      margin: 20px 0;
      font-size: 15px;
      color: #98747f;
      letter-spacing: 1px;
    }

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px auto;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .music-button {
      margin: 6px;
      background: rgba(255, 255, 255, 0.7);
    }

    .back-button {
      display: block;
      margin: 16px auto 0;
      background: transparent;
      border: none;
      color: #9c7c85;
      font-size: 14px;
      padding: 10px;
    }

    .bottom-heart {
      color: #d59aaa;
      font-size: 18px;
      margin-top: 24px;
    }

    @media (max-width: 400px) {
      .cover-card {
        padding: 30px 18px;
      }

      .intro-text {
        font-size: 16px;
      }

      .nav-button {
        padding: 11px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Background piano music -->
  <audio id="backgroundMusic" loop preload="auto">
    <source
      src="our_little_melody_soft.wav"
      type="audio/wav"
    >
  </audio>

  <!-- WELCOME SCREEN -->
  <section class="cover" id="cover">
    <div class="cover-card">

      <div class="little-heart">♡</div>

      <h1>A Little World of Us</h1>

      <div class="intro-text">
        For the little moments,<br>
        the silly memories,<br>
        and all the little things<br>
        that make our world special.<br><br>

        Some memories deserve<br>
        a place of their own. 🌸
      </div>

      <button class="main-button" id="startButton">
        ♫ Play the melody ♫
      </button>

      <div class="small-note">
        A little scrapbook of memories ♡
      </div>

    </div>
  </section>


  <!-- SCRAPBOOK PAGES -->
  <main class="scrapbook" id="scrapbook">

    <h1 class="top-heading">Our Little Memories ♡</h1>

    <p class="subtitle">
      Little moments, kept somewhere special.
    </p>

    <div class="page-frame">
      <img
        id="scrapbookImage"
        class="scrapbook-image"
        src="Scrapbook1.png"
        alt="Scrapbook memory"
      >
    </div>

    <div class="page-counter" id="pageCounter">
      ♡ 1 of 3 ♡
    </div>

    <div class="navigation">

      <button
        class="nav-button"
        id="previousButton"
        disabled
      >
        ← Previous
      </button>

      <button
        class="nav-button"
        id="nextButton"
      >
        Next →
      </button>

    </div>

    <button class="music-button" id="musicButton">
      ♫ Pause music
    </button>

    <button class="back-button" id="backButton">
      ↶ Back to the beginning
    </button>

    <div class="bottom-heart">♡</div>

  </main>


  <script>
    const cover = document.getElementById("cover");
    const scrapbook = document.getElementById("scrapbook");

    const music = document.getElementById("backgroundMusic");

    // Keep the piano music soft.
    music.volume = 0.15;

    const startButton = document.getElementById("startButton");
    const musicButton = document.getElementById("musicButton");
    const backButton = document.getElementById("backButton");

    const image = document.getElementById("scrapbookImage");
    const pageCounter = document.getElementById("pageCounter");

    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    // IMPORTANT:
    // These filenames must match the files in your GitHub repository.
    const pages = [
      "Scrapbook1.png",
      "Scrapbook2.png",
      "Scrapbook 3.png"
    ];

    let currentPage = 0;

    // Start the music and open scrapbook page 1 together.
    startButton.addEventListener("click", async function () {

      cover.style.display = "none";
      scrapbook.style.display = "block";

      currentPage = 0;
      showPage();

      try {
        await music.play();
        musicButton.textContent = "♫ Pause music";
      } catch (error) {
        musicButton.textContent = "♫ Play music";
        console.log("Music could not start:", error);
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });


    // Display the selected scrapbook page.
    function showPage() {
      image.src = pages[currentPage];

      pageCounter.textContent =
        "♡ " + (currentPage + 1) + " of " + pages.length + " ♡";

      previousButton.disabled = currentPage === 0;

      nextButton.disabled =
        currentPage === pages.length - 1;
    }


    // Previous page.
    previousButton.addEventListener("click", function () {
      if (currentPage > 0) {
        currentPage--;
        showPage();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    });


    // Next page.
    nextButton.addEventListener("click", function () {
      if (currentPage < pages.length - 1) {
        currentPage++;
        showPage();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    });


    // Play or pause the piano music.
    musicButton.addEventListener("click", async function () {

      if (music.paused) {
        try {
          await music.play();
          musicButton.textContent = "♫ Pause music";
        } catch (error) {
          musicButton.textContent = "♫ Play music";
        }
      } else {
        music.pause();
        musicButton.textContent = "♫ Play music";
      }

    });


    // Return to the welcome screen.
    backButton.addEventListener("click", function () {
      scrapbook.style.display = "none";
      cover.style.display = "flex";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });


    // If the music finishes or is paused, keep the button label sensible.
    music.addEventListener("ended", function () {
      musicButton.textContent = "♫ Play music";
    });

  </script>

</body>
</html>
