<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little World of Us ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  color: #674c53;
  background: linear-gradient(135deg, #fff7f8, #fce8ed, #fff3f5);
  text-align: center;
}

button {
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.cover {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.cover-card {
  width: 100%;
  max-width: 430px;
  padding: 36px 22px;
  background: rgba(255,255,255,0.78);
  border: 1px solid #f3d4dd;
  border-radius: 28px;
  box-shadow: 0 12px 35px rgba(160,105,125,0.13);
}

.heart {
  font-size: 38px;
  color: #d58b9f;
  margin-bottom: 12px;
}

h1 {
  font-weight: normal;
  font-size: clamp(28px, 7vw, 38px);
  line-height: 1.3;
  margin: 8px 0 20px;
}

.intro {
  font-size: 17px;
  line-height: 1.9;
  color: #846b72;
  margin-bottom: 28px;
}

.main-button,
.nav-button,
.music-button {
  padding: 12px 19px;
  border: 1px solid #e9bac9;
  border-radius: 30px;
  background: #f9e1e8;
  color: #76515d;
  font-size: 15px;
  transition: background 0.2s;
}

.main-button:hover,
.nav-button:hover,
.music-button:hover {
  background: #f4d1dc;
}

.small-note {
  margin-top: 22px;
  color: #a4878f;
  font-size: 13px;
}

.scrapbook {
  display: none;
  min-height: 100vh;
  padding: 24px 14px 35px;
}

.heading {
  font-size: 29px;
  margin: 8px 0;
}

.subtitle {
  font-size: 14px;
  color: #a1818b;
  margin: 0 0 22px;
}

.page-frame {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 9px;
  background: rgba(255,255,255,0.8);
  border: 1px solid #f0d1da;
  border-radius: 17px;
  box-shadow: 0 10px 28px rgba(160,105,125,0.13);
}

.scrapbook-image {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 10px;
}

.page-counter {
  margin: 20px 0;
  color: #98747f;
  font-size: 15px;
  letter-spacing: 1px;
}

.navigation {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px auto;
}

.nav-button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.music-button {
  margin: 6px;
  background: rgba(255,255,255,0.75);
}

.back-button {
  display: block;
  margin: 16px auto 0;
  padding: 10px;
  border: none;
  background: transparent;
  color: #9c7c85;
  font-size: 14px;
}

.bottom-heart {
  color: #d59aaa;
  font-size: 20px;
  margin-top: 24px;
}

@media (max-width: 400px) {
  .cover-card {
    padding: 30px 18px;
  }

  .intro {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- SOFT PIANO MUSIC -->
<audio id="backgroundMusic" loop preload="auto">
  <source src="our_little_melody_soft.wav" type="audio/wav">
</audio>

<!-- WELCOME SCREEN -->
<section class="cover" id="cover">
  <div class="cover-card">

    <div class="heart">♡</div>

    <h1>A Little World of Us</h1>

    <div class="intro">
      For the little moments,<br>
      the silly memories,<br>
      and all the little things<br>
      that make our world special.<br><br>
      Some memories deserve<br>
      a place of their own. 🌸
    </div>

    <button class="main-button" id="startButton">
      ♫ Play the melody ♫
    </button>

    <div class="small-note">
      A little scrapbook of memories ♡
    </div>

  </div>
</section>

<!-- SCRAPBOOK -->
<main class="scrapbook" id="scrapbook">

  <h1 class="heading">Our Little Memories ♡</h1>

  <p class="subtitle">
    Little moments, kept somewhere special.
  </p>

  <div class="page-frame">
    <img
      id="scrapbookImage"
      class="scrapbook-image"
      src="scrapbook1.png"
      alt="Our scrapbook memories"
    >
  </div>

  <div class="page-counter" id="pageCounter">
    ♡ 1 of 3 ♡
  </div>

  <div class="navigation">

    <button class="nav-button" id="previousButton" disabled>
      ← Previous
    </button>

    <button class="nav-button" id="nextButton">
      Next →
    </button>

  </div>

  <button class="music-button" id="musicButton">
    ♫ Pause music
  </button>

  <button class="back-button" id="backButton">
    ↶ Back to the beginning
  </button>

  <div class="bottom-heart">♡</div>

</main>

<script>
const cover = document.getElementById("cover");
const scrapbook = document.getElementById("scrapbook");

const music = document.getElementById("backgroundMusic");
music.volume = 0.15;

const startButton = document.getElementById("startButton");
const musicButton = document.getElementById("musicButton");
const backButton = document.getElementById("backButton");

const image = document.getElementById("scrapbookImage");
const pageCounter = document.getElementById("pageCounter");

const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");

/* EXACT FILENAMES FROM YOUR GITHUB SCREENSHOT */
const pages = [
  "scrapbook1.png",
  "scrapbook2.png",
  "scrapbook3.png"
];

let currentPage = 0;

/* Show the selected scrapbook page */
function showPage() {
  image.src = pages[currentPage];

  pageCounter.textContent =
    "♡ " + (currentPage + 1) + " of " + pages.length + " ♡";

  previousButton.disabled = currentPage === 0;
  nextButton.disabled = currentPage === pages.length - 1;
}

/* Show an error if an image cannot load */
image.addEventListener("error", function() {
  console.error("Could not load scrapbook image:", image.src);
});

/* Start music and open the scrapbook */
startButton.addEventListener("click", async function() {
  cover.style.display = "none";
  scrapbook.style.display = "block";

  currentPage = 0;
  showPage();

  try {
    await music.play();
    musicButton.textContent = "♫ Pause music";
  } catch (error) {
    musicButton.textContent = "♫ Play music";
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Previous page */
previousButton.addEventListener("click", function() {
  if (currentPage > 0) {
    currentPage--;
    showPage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* Next page */
nextButton.addEventListener("click", function() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    showPage();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

/* Play or pause music */
musicButton.addEventListener("click", async function() {
  if (music.paused) {
    try {
      await music.play();
      musicButton.textContent = "♫ Pause music";
    } catch (error) {
      musicButton.textContent = "♫ Play music";
    }
  } else {
    music.pause();
    musicButton.textContent = "♫ Play music";
  }
});

/* Return to welcome screen */
backButton.addEventListener("click", function() {
  scrapbook.style.display = "none";
  cover.style.display = "flex";

  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Keep the music button label updated */
music.addEventListener("pause", function() {
  musicButton.textContent = "♫ Play music";
});

music.addEventListener("play", function() {
  musicButton.textContent = "♫ Pause music";
});
</script>

</body>
</html>
